services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookingdb
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d bookingdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  topology:
    build:
      context: ./helm/topology/app
      dockerfile: Dockerfile
    environment:
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest
      - RabbitMq__VirtualHost=/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"

  hotel-migrate:
    build:
      context: ./src
      dockerfile: HotelService/Dockerfile
    command: ["--migrate"]
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=hoteldb;Username=booking;Password=booking123
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  booking-migrate:
    build:
      context: ./src
      dockerfile: BookingService/Dockerfile
    command: ["--migrate"]
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=bookingdb;Username=booking;Password=booking123
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  payment-migrate:
    build:
      context: ./src
      dockerfile: PaymentService/Dockerfile
    command: ["--migrate"]
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=paymentdb;Username=booking;Password=booking123
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  guest-migrate:
    build:
      context: ./src
      dockerfile: GuestService/Dockerfile
    command: ["--migrate"]
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=guestdb;Username=booking;Password=booking123
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  hotel-service:
    build:
      context: ./src
      dockerfile: HotelService/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=hoteldb;Username=booking;Password=booking123
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      hotel-migrate:
        condition: service_completed_successfully
      topology:
        condition: service_completed_successfully

  booking-service:
    build:
      context: ./src
      dockerfile: BookingService/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=bookingdb;Username=booking;Password=booking123
      - Services__HotelService=http://hotel-service:8080
      - Services__GuestService=http://guest-service:8080
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest
      - Cdc__BootstrapServers=redpanda:9092
      - Features__UseReplica=true
      - Features__DualRead=true
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      booking-migrate:
        condition: service_completed_successfully
      topology:
        condition: service_completed_successfully

  payment-service:
    build:
      context: ./src
      dockerfile: PaymentService/Dockerfile
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=paymentdb;Username=booking;Password=booking123
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      payment-migrate:
        condition: service_completed_successfully
      topology:
        condition: service_completed_successfully

  notification-service:
    build:
      context: ./src
      dockerfile: NotificationService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest
    depends_on:
      rabbitmq:
        condition: service_healthy
      topology:
        condition: service_completed_successfully

  guest-service:
    build:
      context: ./src
      dockerfile: GuestService/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=guestdb;Username=booking;Password=booking123
    depends_on:
      postgres:
        condition: service_healthy
      guest-migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
