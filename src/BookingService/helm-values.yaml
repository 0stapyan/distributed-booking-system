replicaCount: 2

image:
  repository: europe-central2-docker.pkg.dev/kse-distributed-systems-2026/kse-ds-registry/team-06/booking-service
  tag: "latest"
  pullPolicy: Always

migration:
  enabled: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  host: team-06.booking.34.116.253.250.nip.io
  ingressClassName: nginx

resources:
  requests:
    cpu: 25m
    memory: 200Mi
  limits:
    cpu: 300m
    memory: 512Mi

env:
  - name: ASPNETCORE_ENVIRONMENT
    value: Production
  - name: ASPNETCORE_URLS
    value: http://+:8080;http://+:8081
  - name: Jwt__Authority
    value: https://keycloak.34.116.253.250.nip.io/realms/team-06
  - name: Jwt__MetadataAddress
    value: http://keycloak.auth.svc.cluster.local/realms/team-06/.well-known/openid-configuration
  - name: Jwt__Audience
    value: account
  - name: Otel__Endpoint
    value: http://otel-collector-opentelemetry-collector.team-06.svc.cluster.local:4317
  - name: MAINTENANCE_MODE
    value: "false"
  - name: RabbitMq__HostName
    value: rabbitmq.messaging.svc.cluster.local
  - name: RabbitMq__Port
    value: "5672"
  - name: RabbitMq__UserName
    value: team-06-booking-service
  - name: RabbitMq__VirtualHost
    value: /team-06
  - name: Kafka__BootstrapServers
    value: kafka.cdc.svc.cluster.local:9092
  - name: Features__UseReplica
    value: "true"
  - name: Services__GuestScore
    value: http://guest-score-service.team-06.svc.cluster.local

envFromSecrets:
  - name: ConnectionStrings__DefaultConnection
    secretName: booking-db-secret
    secretKey: ConnectionStrings__DefaultConnection
  - name: RabbitMq__Password
    secretName: rabbitmq-booking-service-credentials
    secretKey: password

serviceAccount:
  name: booking-service
