apiVersion: linkerd.io/v1alpha2
kind: ServiceProfile
metadata:
  name: payment-service.team-06.svc.cluster.local
  namespace: team-06
spec:
  retryBudget:
    retryRatio: 0.2
    minRetriesPerSecond: 10
    ttl: 10s
  routes:
    - name: GET /api/internal/payments/stats
      condition:
        method: GET
        pathRegex: /api/internal/payments/stats
      isRetryable: true
      timeout: 5s