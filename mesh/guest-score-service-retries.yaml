apiVersion: linkerd.io/v1alpha2
kind: ServiceProfile
metadata:
  name: guest-score-service.team-06.svc.cluster.local
  namespace: team-06
spec:
  retryBudget:
    retryRatio: 0.2
    minRetriesPerSecond: 10
    ttl: 10s
  routes:
    - name: POST /api/guest-score
      condition:
        method: POST
        pathRegex: /api/guest-score
      isRetryable: true
      timeout: 5s
